[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "windbench"
version = "0.1.0"
description = "Winding benchmark on PHerc. 1667: ground-truth wrap index and winding position on 9.6 um crops, plus the shared winding metrics."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
]

# windbench.metrics (used by spiralfiteval) is pure numpy/scipy. The crop builder and the
# CT readers import zarr, s3fs and tifffile lazily; install [data] to use them.
[project.optional-dependencies]
data = ["zarr>=3", "s3fs>=2024.6", "tifffile>=2024.1"]
tests = ["pytest>=8"]

[project.scripts]
windbench = "windbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["windbench*"]
